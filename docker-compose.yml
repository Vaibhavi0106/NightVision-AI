version: '3.8'

services:
  nightvision-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nightvision_ai_studio
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
